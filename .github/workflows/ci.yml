name: CI

# Tiered for Actions minutes. Every push: lint, types and tests on one Python. Big checks (all Pythons, Godot) run on
# the PR once it leaves draft (PRs stay drafts while in development and review), and again only if a commit lands
# after that: the last gate before merge. Run workflow runs everything. A vX.Y.Z tag only runs the release and
# publish (PyPI, MCP Registry) jobs.
on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # one Python on a push; all three before merge
        python-version: ${{ fromJSON(github.event_name == 'push' && '["3.12"]' || '["3.11", "3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Smoke test CLI
        run: segan --version
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Run tests
        run: pytest
      - name: Lint the demo project
        working-directory: examples/demo
        run: segan lint --warnings-as-errors

  godot:
    # Builds the demo into the example Godot project, checks the committed output is identical (WAVs within
    # 1 LSB, everything else byte for byte), then loads and plays everything in a real headless Godot.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2-stable"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o ~/godot/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q ~/godot/godot.zip -d ~/godot
          rm ~/godot/godot.zip
      - name: Point GODOT at the binary
        run: |
          chmod +x ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Build the demo and check the committed output is up to date
        working-directory: examples/demo
        run: |
          segan build
          python ../../scripts/check_committed_build.py ../godot/assets/generated/audio
      - name: Verify in Godot
        working-directory: examples/demo
        run: segan build --verify-godot
      - name: Godot end-to-end tests
        run: pytest tests/test_godot.py -v

  orchestra:
    # The sampled-orchestra example: fetches the VSCO 2 CE instruments it uses (kit, songs and sfx; pinned,
    # checked; cached between runs), then lints and builds it.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    env:
      SEGAN_SAMPLES: ${{ github.workspace }}/.samples
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Cache samples
        uses: actions/cache@v6
        with:
          path: .samples
          key: samples-${{ hashFiles('src/segan/libraries/*/library.json', 'examples/orchestra/**/*.yaml') }}
          restore-keys: samples-
      - name: Fetch the instruments the project uses
        working-directory: examples/orchestra
        run: segan samples fetch vsco2 $(python -c "from pathlib import Path; from segan.kitshow import library_needs; print(' '.join(library_needs(Path('.'))))")
      - name: Lint and build
        working-directory: examples/orchestra
        run: |
          segan lint --warnings-as-errors
          segan build

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions match the tag
        run: |
          python3 - "${GITHUB_REF_NAME#v}" <<'EOF'
          import json, sys, tomllib
          ver = sys.argv[1]
          server = json.load(open("server.json"))
          found = {tomllib.load(open("pyproject.toml", "rb"))["project"]["version"], server["version"]}
          found |= {p["version"] for p in server["packages"]}
          sys.exit(0 if found == {ver} else f"tag {ver} but pyproject/server.json say {sorted(found)}")
          EOF
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md >notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $ver"; exit 1; }
          # a re-run (after a failed publish) finds the release already there
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md

  publish:
    # PyPI through Trusted Publishing (environment pypi, no token), then server.json to the MCP Registry (GitHub OIDC).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # a re-run after a failed registry step finds the files already on PyPI
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          # the registry reads the README from PyPI, which can take a moment to show the new release
          for i in 1 2 3 4 5; do ./mcp-publisher publish && exit 0; sleep 30; done
          exit 1
