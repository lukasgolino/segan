sections:
  intro: { patterns: [a, b], mute: [lead, drums] }
  verse: [a, b, a, f]
  chorus: [c, d, c, d]
  breakdown: { patterns: [a, b], mute: [drums, harmony], velocity: 0.8 }
  bridge: { from: chorus, key: D major, velocity: 0.85 }                    # G | D | Bm | A
  chorus_soft: { from: chorus, mute: [drums], velocity: 0.7, instrument_swap: { p: q } }
  outro: [z]
arrangement: [intro, verse, chorus, breakdown, chorus, bridge, chorus_soft, verse, chorus, outro]

flow:
  start: intro
  next:
    intro: [verse]
    verse: { chorus: 3, breakdown: 1 }
    breakdown: [chorus]
    chorus: { verse: 2, bridge: 1, chorus_soft: 1 }
    bridge: [chorus]
    chorus_soft: { verse: 1, bridge: 1 }
  end: outro
