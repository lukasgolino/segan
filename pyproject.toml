[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "segan"
version = "0.16.0"
description = "SEGAN (Sound Effect Grammar And Notation): write game sound effects and music as text, build them into WAVs and game-ready assets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lukas Golino" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "Pillow>=10.1",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.15", "types-PyYAML", "mcp>=2.3,<3", "soundfile>=0.12"]
mcp = ["mcp>=2.3,<3"]
ogg = ["soundfile>=0.12"]

[project.scripts]
segan = "segan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
segan = ["templates/*", "skill/*", "skill/topics/*", "presets/*", "fingerprints/*.json", "libraries/*/*.json", "libraries/*/*.sfz", "libraries/*/*.txt"]

[tool.mypy]
strict = true
files = ["src/segan", "tests"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "soundfile"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long lines are fine; no formatter is enforced
