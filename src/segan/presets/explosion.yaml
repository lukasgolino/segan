# Big chunky explosion: falling crunch noise through a closing low-pass, over a deep thump.
category: sfx
duration: 1.3
layers:
  - id: crunch
    osc: bitnoise
    pitch: [[0, C5], [0.9, C2]]
    slide: true
    filter: { type: lp, cutoff: 5000, resonance: 0.15 }
    cutoff: [[0, 6000], [0.25, 2200], [1.0, 300]]
    env: [0.002, 0.25, 0.45, 0.7]
    length: 0.45
    gain: -3
  - id: thump
    drum: kick
    tune: 38
    decay: 0.6
    punch: 24
    click: 0.5
    gain: -2
  - id: hiss
    osc: noise
    filter: { type: hp, cutoff: 3000 }
    env: [0.001, 0.12, 0.0, 0.05]
    gain: -16
